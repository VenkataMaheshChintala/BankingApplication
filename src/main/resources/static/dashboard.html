<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Banking Dashboard | Modern Bank</title>

    <script src="/dashboardjs.js" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="/dashboardstyle.css" rel="stylesheet">

    <script>
        const token = localStorage.getItem("token");
        const userid = localStorage.getItem("userid");
        if (token == null) {
            window.location = "/login.html"
        }
        async function accounts() {
            const response = await fetch("/accountapi/accounts", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    userId: userid
                })
            });
            const data = await response.json();
            if (!response.ok) {
                console.log("API ERROR:", response.status, data);
                return false;
            }
            localStorage.setItem(
                "accounts",
                JSON.stringify(data.accounts)
            );
            return true;
        }


        function load() {
            const stored = localStorage.getItem("accounts");
            if (!stored) {
                console.log("No accounts in localStorage");
                return;
            }
            const accounts = JSON.parse(stored);
            const accountsbody = document.getElementById("accountsbody");
            accountsbody.innerHTML = "";
            accounts.forEach(account => {
                const row = document.createElement("tr");
                row.innerHTML = `
                <td>${account.accountNumber}</td>
                <td>${account.accountType}</td>
                <td>${account.status}</td>
            `;
                accountsbody.appendChild(row);
            });
        }

        async function initializeDashboard() {
            const success = await accounts();
            if (success) {
                load();
            }
        }

        initializeDashboard();
    </script>
</head>

<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="logo-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2>Modern Bank</h2>
        </div>

        <div class="menu-item active" onclick="showpage('accounts', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Accounts
        </div>
        <div class="menu-item" onclick="showpage('balance', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <line x1="12" y1="1" x2="12" y2="23"></line>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            Check Balance
        </div>
        <div class="menu-item" onclick="showpage('history', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <p onclick="loadAccounts()">Transaction History</p>
        </div>
        <button class="logout-btn" onclick="logout()">Log out</button>
    </aside>

    <main class="content">
        <div id="accounts" class="page active-page">
            <h1 class="page-title">Accounts Overview</h1>

            <div class="card">
                <table id="accountstable">
                    <thead>
                        <tr>
                            <th>Account Number</th>
                            <th>Account Type</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="accountsbody"></tbody>
                </table>
            </div>

            <div class="card">
                <h3>Open New Account</h3>
                <div class="form-group">
                    <label for="username">Account Holder Name</label>
                    <input type="text" id="username" placeholder="Enter Username" />
                </div>
                <div class="form-group">
                    <label for="accountType">Account Type</label>
                    <select id="accountType">
                        <option value="SAVINGS">Savings Account</option>
                        <option value="CURRENT">Current Account</option>
                    </select>
                </div>
                <button class="primary-btn" onclick="createAccount()">
                    Create Account
                </button>
            </div>

            <div class="card">
                <h3>Quick Actions</h3>
                <div class="action-buttons">
                    <button class="action-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Deposit
                    </button>
                    <button class="action-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Withdraw
                    </button>
                    <button class="action-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                        Transfer
                    </button>
                </div>
            </div>
        </div>

        <div id="balance" class="page">
            <h1 class="page-title">Check Balance</h1>
            <div class="card">
                <h3>Inquire Balance</h3>
                <div class="form-group">
                    <label for="checkBalanceAccountNumber">Account Number</label>
                    <input type="text" placeholder="Enter 10-digit Account Number" id="checkBalanceAccountNumber" />
                </div>
                <button class="primary-btn" onclick="loadAccounts()">
                    Check Balance
                </button>
                <div class="balance-result">₹ 0.00</div>
            </div>
        </div>

        <div id="history" class="page">
            <h1 class="page-title">Transaction History</h1>
            <div class="card" id="userAccounts"></div>
        </div>

        <div id="balanceModal" class="modal">
            <div class="modal-content">
                <h2>Account Balance</h2>
                <p id="balanceText"></p>
                <button onclick="closeBalanceModal()">OK</button>
            </div>
        </div>
        <div id="passwordModal" class="modal">
            <div class="modal-content">
                <h2>Verify your identity</h2>
                <p>Enter your password</p>
                <input type="password" id="passwordInput" placeholder="Enter password">
                <br><br>
                <button onclick="submitPassword()">Submit</button>
                <button onclick="closePasswordModal()">Cancel</button>
            </div>
        </div>
    </main>
</body>

</html>
