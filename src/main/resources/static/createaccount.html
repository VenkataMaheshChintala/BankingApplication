<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Create Bank Account | Modern Bank</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link href="/createaccountstyle.css" rel="stylesheet">
        <script src="/createaccountjs.js"></script>

        <script>
            const token = localStorage.getItem("token");
            if(token==null) {
                window.location="/login.html"
            }
        </script>
        
    </head>

    <body>
        <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="logo-container">
                <div class="logo-box">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
            </div>

            <div class="header-text">
                <h2>Open Account</h2>
                <p>Select your preferred banking account</p>
            </div>

            <form onsubmit="event.preventDefault();">
                
                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="username" placeholder="Enter Username" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="accountType">Account Type</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                        </svg>
                        <select id="accountType" required>
                            <option value="" disabled selected hidden>Select Account Type</option>
                            <option value="SAVINGS">Savings Account</option>
                            <option value="CURRENT">Current Account</option>
                        </select>
                    </div>
                </div>

                <button type="button" class="submit-btn" onclick="createAccount()">Open Account</button>
            </form>

            <div class="message" id="message"></div>

        </div>
    </div>
    </body>
</html>
